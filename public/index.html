// Apply the saved theme before the page paints.

  let theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const fmt = (n) => (n ?? 0).toLocaleString();
const money = (minor, currency = "USD", decimals = 2) => {
  try { return new Intl.NumberFormat(undefined, { style: "currency", currency, minimumFractionDigits: decimals, maximumFractionDigits: decimals }).format((minor || 0) / 100); }
  catch { return currency + " " + ((minor || 0) / 100).toFixed(decimals); }
};
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const themeColor = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const accA = (a) => 'rgba(' + themeColor('--accent-rgb') + ',' + a + ')';
function updateThemeButton() {
  const dark = document.documentElement.dataset.theme === 'dark';
  $('themebtn').innerHTML = dark
    ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><span>Light</span>'
    : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20 14a8 8 0 0 1-10-10 8 8 0 1 0 10 10Z"/></svg><span>Dark</span>';
  $('themebtn').setAttribute('aria-label', 'Switch to ' + (dark ? 'light' : 'dark') + ' theme');
  $('themebtn').title = 'Switch to ' + (dark ? 'light' : 'dark') + ' theme';
}
function setTheme(theme) {
  document.documentElement.dataset.theme = theme;
  try { localStorage.setItem('lucid-theme', theme); } catch {}
  updateThemeButton();
  if (state.site && state.data) { renderChart(); drawMap(); }
  else if ($('cards')) {
    const query = $('sitesearch')?.value.trim().toLowerCase() || '';
    renderCards(state.sitesList.filter(site => site.domain.includes(query)));
  }
}
$('themebtn').addEventListener('click', () => setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));
window.addEventListener('storage', e => { if (e.key === 'lucid-theme' && (e.newValue === 'light' || e.newValue === 'dark')) setTheme(e.newValue); });
updateThemeButton();

/* ================= state & routing ================= */

const state = {
  sitesList: [],
  site: null,
  range: null,          // {key,label,from,to}
  filters: [],
  metric: "visitors",
  data: null,
  journeyStart: null,
};

const RANGES = [
  { key: "day",   label: "Today",          kbd: "D" },
  { key: "yday",  label: "Yesterday",      kbd: "E" },
  { key: "24h",   label: "Last 24 Hours",  kbd: "H" },
  { key: "7d",    label: "Last 7 Days",    kbd: "W" },
  { key: "28d",   label: "Last 28 Days",   kbd: "F" },
  { key: "91d",   label: "Last 91 Days",   kbd: "N" },
  { key: "180d",  label: "Last 180 Days",  kbd: "" },
  { key: "365d",  label: "Last 365 Days",  kbd: "" },
  { key: "mtd",   label: "Month to Date",  kbd: "M" },
  { key: "lastm", label: "Last Month",     kbd: "P" },
  { key: "ytd",   label: "Year to Date",   kbd: "Y" },
  { key: "12mo",  label: "Last 12 Months", kbd: "L" },
  { key: "all",   label: "All time",       kbd: "A" },
  { key: "custom",label: "Custom Range",   kbd: "C" },
];

function rangeFor(key, customFrom, customTo) {
  const now = Math.floor(Date.now() / 1000);
  const midnight = new Date(); midnight.setHours(0, 0, 0, 0);
  const mid = Math.floor(midnight.getTime() / 1000);
  const d = new Date();
  const def = RANGES.find((r) => r.key === key) || RANGES[4];
  let from, to = now, label = def.label;

  switch (key) {
    case "day":   from = mid; break;
    case "yday":  from = mid - 86400; to = mid; break;
    case "24h":   from = now - 86400; break;
    case "7d":    from = now - 7 * 86400; break;
    case "91d":   from = now - 91 * 86400; break;
    case "180d":  from = now - 180 * 86400; break;
    case "365d":  from = now - 365 * 86400; break;
    case "mtd":   from = Math.floor(new Date(d.getFullYear(), d.getMonth(), 1).getTime() / 1000); break;
    case "lastm": {
      from = Math.floor(new Date(d.getFullYear(), d.getMonth() - 1, 1).getTime() / 1000);
      to = Math.floor(new Date(d.getFullYear(), d.getMonth(), 1).getTime() / 1000);
      break;
    }
    case "ytd":   from = Math.floor(new Date(d.getFullYear(), 0, 1).getTime() / 1000); break;
    case "12mo":  from = now - 365 * 86400; break;
    case "all":   from = 0; break;
    case "custom":
      from = customFrom; to = customTo;
      label = new Date(from * 1000).toLocaleDateString(undefined, { day: "numeric", month: "short" }) +
              " – " + new Date((to - 1) * 1000).toLocaleDateString(undefined, { day: "numeric", month: "short" });
      break;
    default:      from = now - 28 * 86400; break;
  }
  return { key, label, from, to };
}
state.range = rangeFor("28d");

function route() {
  stopPoll();
  const hash = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  if (hash) { state.site = hash; showDashboard(); }
  else { state.site = null; showSites(); }
}
window.addEventListener("hashchange", route);
$("homebtn").addEventListener("click", () => { location.hash = "/"; });
$("excludedbtn").addEventListener("click", () => { excludedModal(); });

/* ================= sites index ================= */

async function fetchSites() {
  const res = await fetch("/api/sites");
  if (!res.ok) throw new Error("Could not load sites (" + res.status + ")");
  const { sites } = await res.json();
  state.sitesList = sites.concat(previewCards());
  return state.sitesList;
}

async function showSites() {
  const host = $("view");
  host.innerHTML = '<div class="sites-head"><div class="eyebrow">Your workspace</div><h1>Websites</h1><p>A clear view of the people visiting your websites.</p></div><div class="empty">Loading…</div>';
  let sites;
  try { sites = await fetchSites(); }
  catch (e) { host.innerHTML = '<div class="errbox">' + esc(e.message) + "</div>"; return; }

  host.innerHTML = `
    <div class="sites-head"><div class="eyebrow">Your workspace</div><h1>Websites</h1><p>A clear view of the people visiting your websites.</p></div>
    <div class="sites-toolbar">
      <input class="searchbox" id="sitesearch" aria-label="Search websites" placeholder="Search websites…">
      <div class="toolbar-right">
        <span class="liveind" title="Refreshes automatically every 30 seconds"><span class="dot"></span><span id="liveago">Live</span></span>
        <button class="btn primary" id="addsite">Add website</button>
        <button class="btn" id="addpreview">Add preview site</button>
      </div>
    </div>
    <div class="cards" id="cards"></div>
    <p class="note">Visitors in the last 24 hours, compared with the 24 hours before.</p>`;

  renderCards(sites);
  markUpdated();
  $("sitesearch").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    renderCards(sites.filter((s) => s.domain.includes(q)));
  });
  $("addsite").addEventListener("click", () => addSiteModal());
  $("addpreview").addEventListener("click", () => previewSiteModal());

  startPoll(async () => {
    sites = await fetchSites().catch(() => sites);
    const q = ($("sitesearch") && $("sitesearch").value.trim().toLowerCase()) || "";
    renderCards(q ? sites.filter((s) => s.domain.includes(q)) : sites);
    markUpdated();
  });
}

function renderCards(sites) {
  const host = $("cards");
  if (!sites.length) {
    host.innerHTML = $('sitesearch')?.value.trim() ? '<div class="empty">No websites match your search.</div>' : '<div class="onboarding"><div class="onboarding-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M7 16v-3m5 3V8m5 8v-5"/></svg></div><h2>Your first website starts here</h2><p>Add your website and install a small tracking script to see where visitors come from and what they do.</p><button class="btn primary" id="firstsite">Add your first website</button><div class="setup-steps"><span><b>1</b>Add a domain</span><span><b>2</b>Install the script</span><span><b>3</b>See your traffic</span></div></div>'; $('firstsite')?.addEventListener('click', addSiteModal);
    return;
  }
  host.innerHTML = sites.map((s, i) => {
    const cls = s.delta > 0 ? "up" : s.delta < 0 ? "down" : "flat";
    const arrow = s.delta > 0 ? "↗" : s.delta < 0 ? "↘" : "—";
    const dtext = s.delta === 0 ? "" : Math.abs(s.delta) + "%";
    return `
    <div class="sitecard" data-d="${esc(s.previewId ? 'preview:' + s.previewId : s.domain)}">
      <div class="row1">
        <span class="domain">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          ${esc(s.domain)}
        </span>
        ${s.previewId ? '<span class="preview-badge">Preview</span>' : ''}<button class="dots" data-menu="${i}">⋮</button>
      </div>
      <canvas data-spark="${i}" width="300" height="52"></canvas>
      <div class="row2">
        <div><div class="big tabular">${fmt(s.visitors24h)}</div>
        <div class="lbl">${s.previewId ? 'simulated visitors' : (s.visitors24h === 1 ? "visitor" : "visitors") + ' in last 24h'}</div></div>
        <span class="badge ${cls}">${arrow} ${dtext}</span>
      </div>
    </div>`;
  }).join("");

  host.querySelectorAll(".sitecard").forEach((card) =>
    card.addEventListener("click", (e) => {
      if (e.target.closest(".dots") || e.target.closest(".cardmenu")) return;
      location.hash = "/" + card.dataset.d;
    })
  );
  host.querySelectorAll("[data-menu]").forEach((btn) =>
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      closeMenus();
      const i = +btn.dataset.menu;
      const site = sites[i];
      if (site.previewId) { previewCardMenu(btn, site); return; }
      const menu = document.createElement("div");
      menu.className = "cardmenu";
      menu.innerHTML = `
        <button data-a="open">Open dashboard</button>
        <button data-a="snippet">Copy embed snippet</button>
        <button data-a="remove" class="danger">Remove site</button>`;
      btn.closest(".sitecard").appendChild(menu);
      menu.addEventListener("click", async (ev) => {
        ev.stopPropagation();
        const a = ev.target.dataset.a;
        if (a === "open") location.hash = "/" + site.domain;
        if (a === "snippet") {
          await navigator.clipboard.writeText(snippetFor(site.domain));
          ev.target.textContent = "Copied!";
          setTimeout(closeMenus, 700);
        }
        if (a === "remove") {
          if (confirm("Remove " + site.domain + "? Collected data is kept, but new events stop.")) {
            await fetch("/api/sites?domain=" + encodeURIComponent(site.domain), { method: "DELETE" });
            showSites();
          }
        }
      });
    })
  );
  sites.forEach((s, i) => drawSpark(host.querySelector('[data-spark="' + i + '"]'), s.spark));
}

function snippetFor(domain) {
  return '<script defer src="' + location.origin + '/tracker.js"><' + '/script> <!-- ' + domain + ' -->';
}

function drawSpark(canvas, spark) {
  if (!canvas) return;
  const ratio = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 300, h = 52;
  canvas.width = w * ratio; canvas.height = h * ratio;
  const ctx = canvas.getContext("2d");
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

  // Fill all 24 hourly buckets so the line spans the full card width.
  const byHour = Object.fromEntries((spark || []).map((p) => [p.t, p.v]));
  const values = [];
  const now = Date.now();
  for (let i = 23; i >= 0; i--) {
    // matches the SQL bucket format: strftime('%Y-%m-%dT%H')
    const key = new Date(now - i * 3600_000).toISOString().slice(0, 13);
    values.push(byHour[key] || 0);
  }
  const max = Math.max(1, ...values);
  const x = (i) => (w / 23) * i;
  const y = (v) => h - 6 - (v / max) * (h - 12);

  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, accA(.12));
  grad.addColorStop(1, accA(0));
  ctx.beginPath();
  ctx.moveTo(0, h);
  values.forEach((v, i) => ctx.lineTo(x(i), y(v)));
  ctx.lineTo(w, h);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.beginPath();
  values.forEach((v, i) => (i ? ctx.lineTo(x(i), y(v)) : ctx.moveTo(x(i), y(v))));
  ctx.strokeStyle = themeColor("--accent");
  ctx.lineWidth = 1.8;
  ctx.lineJoin = "round";
  ctx.stroke();
}

function closeMenus() {
  document.querySelectorAll(".cardmenu,.sitemenu,.datemenu,.filtermenu").forEach((m) => m.remove());
}
document.addEventListener("click", (e) => {
  if (!e.target.closest(".cardmenu,.sitemenu,.datemenu,.filtermenu,[data-menu],#sitepick,#datebtn,#filterbtn")) closeMenus();
});

/* ---- add site modal ---- */

function addSiteModal() {
  const m = $("modal");
  m.classList.add("open");
  m.innerHTML = `
    <div class="modal">
      <h3>Add a website</h3>
      <p>Enter the domain you want to track, without https:// or www.</p>
      <div class="err" id="adderr" style="display:none"></div>
      <input class="domain" id="adddomain" placeholder="example.com" autofocus>
      <div class="actions">
        <button class="btn" id="canceladd">Cancel</button>
        <button class="btn primary" id="confirmadd">Add website</button>
      </div>
    </div>`;
  $("canceladd").addEventListener("click", closeModal);
  $("adddomain").addEventListener("keydown", (e) => { if (e.key === "Enter") $("confirmadd").click(); });
  $("confirmadd").addEventListener("click", async () => {
    const domain = $("adddomain").value;
    const res = await fetch("/api/sites", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ domain }),
    });
    const out = await res.json();
    if (!res.ok) {
      $("adderr").style.display = "block";
      $("adderr").textContent = out.error || "Something went wrong.";
      return;
    }
    snippetModal(out.domain);
  });
}

function snippetModal(domain) {
  const m = $("modal");
  m.classList.add("open");
  const snip = snippetFor(domain);
  m.innerHTML = `
    <div class="modal">
      <h3>${esc(domain)} added</h3>
      <p>Paste this into the &lt;head&gt; of the site. Events start appearing as soon as a page loads with it.</p>
      <div class="snippet" id="snip">${esc(snip)}</div>
      <div class="actions">
        <button class="btn" id="copysnip">Copy snippet</button>
        <button class="btn primary" id="donesnip">Done</button>
      </div>
    </div>`;
  $("copysnip").addEventListener("click", async (e) => {
    await navigator.clipboard.writeText(snip);
    e.target.textContent = "Copied!";
  });
  $("donesnip").addEventListener("click", () => { closeModal(); showSites(); });
}

function closeModal() {
  $("modal").classList.remove("open");
  $("modal").innerHTML = "";
}
$("modal").addEventListener("click", (e) => { if (e.target === $("modal")) closeModal(); });

/* ---- excluded places modal (account-wide — applies to every site) ---- */

async function excludedModal() {
  const m = $("modal");
  m.classList.add("open");
  m.innerHTML = `
    <div class="modal">
      <h3>Excluded places</h3>
      <p>Anyone connecting from a country, region, or city on this list is never tracked —
         dropped before the event is written, on every site. Takes effect within 60 seconds,
         no redeploy needed.</p>
      <div class="err" id="exclerr" style="display:none"></div>
      <div class="places" id="places"><div class="empty">Loading…</div></div>
      <div class="frow" style="margin-top:14px">
        <input class="domain" id="newplace" placeholder="e.g. Lombardy, Spain, Brescia" style="margin-bottom:0">
        <button class="btn primary" id="addplace">Add</button>
      </div>
      <div class="actions"><button class="btn" id="exclclose">Done</button></div>
    </div>`;
  $("exclclose").addEventListener("click", closeModal);
  $("newplace").addEventListener("keydown", (e) => { if (e.key === "Enter") $("addplace").click(); });
  $("addplace").addEventListener("click", async () => {
    const place = $("newplace").value.trim();
    if (!place) return;
    const res = await fetch("/api/excluded", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ place }),
    });
    const out = await res.json();
    if (!res.ok) {
      $("exclerr").style.display = "block";
      $("exclerr").textContent = out.error || "Something went wrong.";
      return;
    }
    $("exclerr").style.display = "none";
    $("newplace").value = "";
    loadPlaces();
  });
  await loadPlaces();

  async function loadPlaces() {
    const res = await fetch("/api/excluded");
    const { places } = await res.json();
    const host = $("places");
    if (!host) return;
    if (!places.length) {
      host.innerHTML = '<div class="empty">Nothing excluded — every visitor everywhere is being tracked.</div>';
      return;
    }
    host.innerHTML = places.map((p) =>
      '<span class="fpill"><span class="ftext">' + esc(p) + '</span><button data-p="' + esc(p) + '">&times;</button></span>'
    ).join("");
    host.querySelectorAll("[data-p]").forEach((b) =>
      b.addEventListener("click", async () => {
        await fetch("/api/excluded?place=" + encodeURIComponent(b.dataset.p), { method: "DELETE" });
        loadPlaces();
      }));
  }
}

  country: "Country", region: "Region", city: "City", timezone: "Timezone",

const KIND_OF_FIELD = {
  path: "page", channel: "channel", ref_domain: "source",
  utm_source: "utm", utm_medium: "utm", utm_campaign: "utm",
  country: "location", region: "location", city: "location", timezone: "location",
  browser: "browser", os: "os", device: "device", screen: "screen",
  network: "network", language: "language", visitor_type: "visitor", name: "goal",
};
const FILTER_KINDS = {
  page:     { title: "Filter by Page", fields: ["path"] },
  channel:  { title: "Filter by Channel", fields: ["channel"] },
  source:   { title: "Filter by Source", fields: ["ref_domain"] },
  utm:      { title: "Filter by UTM tags", fields: ["utm_source", "utm_medium", "utm_campaign"] },
  location: { title: "Filter by Location", fields: ["country", "region", "city", "timezone"] },
  browser:  { title: "Filter by Browser", fields: ["browser"] },
  os:       { title: "Filter by Operating system", fields: ["os"] },

function suggestionsFor(field) {
  const d = state.data || {};
  const src = {
    path: d.pages, channel: d.channels, ref_domain: d.sources,
    utm_campaign: d.campaigns, country: d.countries, region: d.regions, city: d.cities,
    browser: d.browsers, os: d.os, device: d.devices,
    timezone: d.timezones, network: d.networks, language: d.languages,
    screen: d.screens, visitor_type: d.visitorTypes,
    name: (d.goals || []).map((g) => ({ k: g.k, v: g.visitors })),
  }[field];
  return src || [];
}
const dispValue = (field, v) => field === "country" ? countryName(v) : String(v);

function filterModal(kind) {
  const def = FILTER_KINDS[kind];
  if (!def) return;
  const m = $("modal");
  m.classList.add("open");
  m.innerHTML = `
    <div class="modal widem">
      <h3>${def.title}</h3>
      <p>Values on the same field combine with "or"; different fields combine with "and".</p>
      <div id="ffields"></div>
      <div class="actions">
        <button class="btn" id="fclear">Remove filter</button>
        <button class="btn primary" id="fapply">Apply filter</button>
      </div>
    </div>`;
  const host = $("ffields");
  for (const field of def.fields) {
    const existing = state.filters.find((x) => x.field === field);
    const values = existing ? [].concat(existing.value) : [];
    const op = existing && existing.op === "is_not" ? "is_not" : "is";
    const el = document.createElement("div");
    el.className = "ffield";
    el.dataset.field = field;
    el.innerHTML = `
      <label>${FIELD_LABEL[field]}</label>
      <div class="frow">
        <select class="fop">
          <option value="is"${op === "is" ? " selected" : ""}>is</option>
          <option value="is_not"${op === "is_not" ? " selected" : ""}>is not</option>
        </select>
        <div class="fchips">
          <input class="fchipinput" placeholder="Select a ${FIELD_LABEL[field]}">
          <div class="fsuggest"></div>
        </div>
      </div>`;
    host.appendChild(el);
    const chips = el.querySelector(".fchips");
    for (const v of values) addChip(chips, field, v);
    wireChips(el, field);
  }
  $("fapply").addEventListener("click", () => applyFilterModal(def));
  $("fclear").addEventListener("click", () => {
    state.filters = state.filters.filter((f) => !def.fields.includes(f.field));
    closeModal();
    resetAndLoad();
  });
}

function addChip(chips, field, value) {
  const input = chips.querySelector(".fchipinput");
  const span = document.createElement("span");
  span.className = "chip";
  span.dataset.v = value;
  span.innerHTML = esc(dispValue(field, value)) + " <button>×</button>";
  span.querySelector("button").addEventListener("click", () => span.remove());
  chips.insertBefore(span, input);
}

function wireChips(el, field) {
  const chips = el.querySelector(".fchips");
  const input = chips.querySelector(".fchipinput");
  const sug = chips.querySelector(".fsuggest");
  const chosen = () => [...chips.querySelectorAll(".chip")].map((c) => c.dataset.v);
  const refresh = () => {
    const q = input.value.trim().toLowerCase();
    const opts = suggestionsFor(field).filter((o) =>
      !chosen().includes(String(o.k)) &&
      (!q || String(o.k).toLowerCase().includes(q) || dispValue(field, o.k).toLowerCase().includes(q))
    ).slice(0, 8);
    sug.innerHTML = opts.map((o) =>
      '<button data-v="' + esc(o.k) + '"><span>' + esc(dispValue(field, o.k)) +
      '</span><span class="n">' + fmt(o.v) + "</span></button>").join("");
    sug.classList.toggle("open", !!opts.length);
  };
  input.addEventListener("focus", refresh);
  input.addEventListener("input", refresh);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && input.value.trim()) {
      addChip(chips, field, input.value.trim());
      input.value = "";
      refresh();
      e.preventDefault();
    }
    if (e.key === "Backspace" && !input.value) {
      const last = chips.querySelector(".chip:last-of-type");
      if (last) last.remove();
      refresh();
    }
  });
  sug.addEventListener("mousedown", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    e.preventDefault();
    addChip(chips, field, b.dataset.v);
    input.value = "";
    refresh();
  });
  input.addEventListener("blur", () => setTimeout(() => sug.classList.remove("open"), 150));
  chips.addEventListener("click", () => input.focus());
}

function applyFilterModal(def) {
  for (const field of def.fields) {
    const el = document.querySelector('.ffield[data-field="' + field + '"]');
    if (!el) continue;
    const values = [...el.querySelectorAll(".chip")].map((c) => c.dataset.v);
    const op = el.querySelector(".fop").value;
    state.filters = state.filters.filter((f) => f.field !== field);
    if (values.length) state.filters.push({ field, op, value: values });
  }
  closeModal();
  resetAndLoad();
}

/* ---- data ---- */

// journeyStart is deliberately NOT reset in here — a background auto-refresh
// re-runs this every 30s, and resetting it there would yank the user out of
// whatever journey they're looking at. It's reset explicitly wherever the
// site, range or filters actually change (see resetAndLoad below).
async function load() {
  if (!state.site) return;
  if (state.site.startsWith('preview:')) {
    const preview = currentPreview();
    if (!preview) { location.hash = '/'; return; }
    state.filters = [];
    state.data = previewStats(preview);
    render();
    return;
  }
  $("error").innerHTML = "";
  const params = new URLSearchParams({
    site: state.site,
    from: state.range.from,
    to: state.range.to,
    filters: JSON.stringify(state.filters),
  });
  const res = await fetch("/api/stats?" + params);
  if (!res.ok) {
    $("error").innerHTML = '<div class="errbox">Query failed (' + res.status + ").</div>";
    return;
  }
  state.data = await res.json();
  render();
  markUpdated();
}

function resetAndLoad() {
  state.journeyStart = null;
  load();
}

/* ---- auto-refresh: dashboard polls for new events while it's open ---- */

const POLL_MS = 30_000;
let pollTimer = null;

function pollBlocked() {
  return document.hidden || $("modal").classList.contains("open") ||
    document.querySelector(".cardmenu,.sitemenu,.datemenu,.filtermenu");
}

function startPoll(fn) {
  stopPoll();
  pollTimer = setInterval(() => { if (!pollBlocked()) fn(); }, POLL_MS);
}
function stopPoll() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

let lastUpdate = 0;
function markUpdated() {
  lastUpdate = Date.now();
  tickLiveLabel();
}
function tickLiveLabel() {
  const el = $("liveago");
  if (!el) return;
  const s = Math.round((Date.now() - lastUpdate) / 1000);
  el.textContent = s < 3 ? "Updated just now" : "Updated " + (s < 60 ? s + "s ago" : Math.floor(s / 60) + "m ago");
}
setInterval(tickLiveLabel, 1000);

function render() {
  if ($('qualitynote')) {
    const q=state.data.quality || {};
    $('qualitynote').textContent=fmt(q.likelyAutomatedSessions || 0)+' likely automated · '+fmt(q.knownBotSessions || 0)+' known bots · '+fmt(q.shortUnqualifiedSessions || 0)+' short unqualified visits excluded';
    $('qualitynote').title='Site-wide counts for this period, before report filters. Likely automated visits match reviewed network and behaviour rules; this is not proof. Short visits have not reached 2 visible seconds or a second page. Raw events are retained.';
  }
  renderFilters();
  renderStats();
  renderChart();
  for (const g of Object.keys(active)) renderPanel(g);
}

function renderFilters() {
  const host = $("filters");
  if (!host) return;
  host.innerHTML = state.filters.map((f, i) => {
    const vals = [].concat(f.value).map((v) => "<b>" + esc(dispValue(f.field, v)) + "</b>").join(" or ");
    return '<span class="fpill" data-i="' + i + '"><span class="ftext">' +
      esc(FIELD_LABEL[f.field] || f.field) + (f.op === "is_not" ? " is not " : " is ") + vals +
      '</span><button data-x="' + i + '">&times;</button></span>';
  }).join("");
  host.querySelectorAll("[data-x]").forEach((b) =>
    b.addEventListener("click", (e) => {
      e.stopPropagation();
      state.filters.splice(+b.dataset.x, 1);
      resetAndLoad();
    }));
  host.querySelectorAll(".fpill .ftext").forEach((t) =>
    t.addEventListener("click", () => {
      const f = state.filters[+t.parentElement.dataset.i];
      const kind = f && KIND_OF_FIELD[f.field];
      if (kind) filterModal(kind);
    }));
}

function delta(pct) {
  if (!pct) return "";
  const cls = pct > 0 ? "up" : "down";
  return '<span class="d ' + cls + '">' + (pct > 0 ? "↗" : "↘") + " " + Math.abs(pct) + "%</span>";
}

async function automationModal() {
  const site=state.site, from=state.range.from, to=state.range.to;
  const modal=$('modal');
  modal.innerHTML='<div class="modal automation-modal" role="dialog" aria-modal="true" aria-labelledby="automation-title"><h3 id="automation-title">Likely automated visits</h3><p>Rules apply to past and future visits. These patterns suggest automation; they are not proof. Raw events stay stored. Disable a rule to include its visits again.</p><p class="note">Site-wide results for the selected period, before report filters. Custom events or another page keep a visit included. Later activity can change a classification.</p><div id="automationerr" class="err" role="alert"></div><div id="automationrules">Loading rules…</div><div id="automationsessions"></div><div class="actions"><button class="btn" id="automationclose">Done</button></div></div>';
  modal.classList.add('open');
  $('automationclose').addEventListener('click',closeModal);
  const params=new URLSearchParams({site,from,to});
  const describe=kind=>kind==='batch'?'At least 3 visitors within 10 seconds, with similar durations':'Repeated reviewed browser profile and closely matching durations';
  async function refresh() {
    const response=await fetch('/api/automation?'+params);
    if(!response.ok) throw new Error('Could not load automation rules ('+response.status+').');

    if(!modal.classList.contains('open') || !$('automationrules')) return;
    $('automationrules').innerHTML=data.rules.length?data.rules.map(rule=>{
      const count=data.counts.filter(c=>c.rule_id===rule.id).reduce((n,c)=>n+c.sessions,0);
      return '<div class="automation-rule"><div><strong>'+esc(rule.network)+'</strong><div>'+esc(rule.city)+', '+esc(rule.country)+'</div><p>'+esc(describe(rule.kind))+'. Direct, homepage only, no custom events.</p><span>'+fmt(count)+' visits excluded in this period</span></div><button class="btn" data-rule="'+esc(rule.id)+'" data-enabled="'+rule.enabled+'">'+(rule.enabled?'Disable':'Enable')+'</button></div>';
    }).join(''):'<p>No reviewed network rules for this site.</p>';
    $('automationsessions').innerHTML='<h4>Excluded visits</h4><p class="note">Showing up to '+data.limit+' recent matches.</p>'+(data.sessions.length?data.sessions.map(s=>'<div class="automation-session"><strong>'+esc(new Date(s.first_ts*1000).toLocaleString())+'</strong><div>'+esc(s.network)+' · '+esc(s.city)+' · '+esc(duration(s.visible_ms/1000))+'</div><div>'+esc(s.reason==='network_batch'?'Network batch':'Repeated reviewed profile')+'</div><code>'+esc(s.session_id)+'</code></div>').join(''):'<p>No matching visits in this period.</p>');
    $('automationrules').querySelectorAll('[data-rule]').forEach(button=>button.addEventListener('click',async()=>{
      button.disabled=true; $('automationerr').textContent='';
      try {
        const saved=await fetch('/api/automation?'+new URLSearchParams({site}),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:button.dataset.rule,enabled:button.dataset.enabled!=='1'})});
        if(!saved.ok) throw new Error('Could not update rule ('+saved.status+').');
        await refresh();
        if(state.site===site) await load();
      } catch(error) { if($('automationerr')) $('automationerr').textContent=error.message; button.disabled=false; }
    }));
  }
  try { await refresh(); } catch(error) { if($('automationerr')) $('automationerr').textContent=error.message; }
  $('automationclose')?.focus({preventScroll:true});
}

function duration(sec) {
  sec = Math.round(sec || 0);
  if (sec < 60) return sec + "s";
  const m = Math.floor(sec / 60);
  if (m < 60) return m + "m " + (sec % 60) + "s";
  return Math.floor(m / 60) + "h " + (m % 60) + "m";
}

/* ---- chart ---- */

function renderChart() {
  if ($("chartmetric")) $("chartmetric").textContent = ({visitors:"Unique visitors", visits:"Total visits", pageviews:"Total pageviews", revenue:"Revenue"})[state.metric];
  const series = state.data.timeseries || [];
  const canvas = $("chart");
  const ratio = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight || 330;
  canvas.width = w * ratio; canvas.height = h * ratio;
  const ctx = canvas.getContext("2d");
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  ctx.clearRect(0, 0, w, h);

  const key = state.metric === "visits" ? "visits" : state.metric === "pageviews" ? "pageviews" : state.metric === "revenue" ? "revenue_minor" : "v";
  const values = series.map((p) => (state.metric === "revenue" ? (p[key] || 0) / 100 : p[key] || 0));

  const padL = 44, padR = 12, padT = 14, padB = 28;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const max = Math.max(1, ...values);
  const niceMax = niceCeil(max);
  // A handful of visitors shouldn't be squashed against the bottom of an
  // axis padded out to a round 4 — the peak should reach the top of the
  // chart. Below that, draw exactly as many gridlines as the axis has whole
  // units, so a max of 1 gets one line (0, 1) instead of four (with the
  // repeated "1, 1, 1, 0" labels that scaling to 4 divisions would produce).
  const divisions = niceMax <= 4 ? niceMax : 4;

  ctx.strokeStyle = themeColor("--line");
  ctx.fillStyle = themeColor("--mute");
  ctx.font = "11px Inter,sans-serif";
  ctx.lineWidth = 1;
  for (let i = 0; i <= divisions; i++) {
    const y = Math.round(padT + (plotH / divisions) * i) + 0.5;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
    ctx.textAlign = "right";
    const tick = niceMax - (niceMax / divisions) * i;
    ctx.fillText(state.metric === "revenue" ? money(tick * 100, state.data.currency, 2) : String(Math.round(tick)), padL - 9, y + 4);
  }

  if (!values.length) {
    ctx.textAlign = "center";
    ctx.fillText("No data in this range", w / 2, h / 2);
    return;
  }

  const x = (i) => padL + (values.length === 1 ? plotW / 2 : (plotW / (values.length - 1)) * i);
  const y = (v) => padT + plotH - (v / niceMax) * plotH;

  const grad = ctx.createLinearGradient(0, padT, 0, padT + plotH);
  grad.addColorStop(0, accA(.12));
  grad.addColorStop(1, accA(0));
  ctx.beginPath();
  ctx.moveTo(x(0), padT + plotH);
  values.forEach((v, i) => ctx.lineTo(x(i), y(v)));
  ctx.lineTo(x(values.length - 1), padT + plotH);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.beginPath();
  values.forEach((v, i) => (i ? ctx.lineTo(x(i), y(v)) : ctx.moveTo(x(i), y(v))));
  ctx.strokeStyle = themeColor("--accent");
  ctx.lineWidth = 1.7;
  ctx.lineJoin = "round";
  ctx.stroke();

  const li = values.length - 1;
  ctx.beginPath(); ctx.arc(x(li), y(values[li]), 3.5, 0, Math.PI * 2);
  ctx.fillStyle = themeColor("--accent"); ctx.fill();

  ctx.fillStyle = themeColor("--mute");
  ctx.textAlign = "center";
  const markCount = Math.max(2, Math.min(6, Math.floor(w / 160)));
  const marks = Array.from({length:markCount}, (_,i) => Math.round(li * i / (markCount - 1)));
  new Set(marks).forEach((i) => ctx.fillText(shortDate(series[i].t), x(i), h - 9));
  canvas.onpointermove = event => {
    const rect = canvas.getBoundingClientRect();
    const pointerX = event.clientX - rect.left;
    if (pointerX < padL || pointerX > w-padR) return;
    const index = Math.max(0,Math.min(values.length-1,Math.round((pointerX-padL)/plotW*(values.length-1))));
    renderChart();
    ctx.beginPath(); ctx.setLineDash([3,3]); ctx.strokeStyle=themeColor('--mute'); ctx.moveTo(x(index),padT); ctx.lineTo(x(index),h-padB); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(x(index),y(values[index]),4,0,Math.PI*2); ctx.fillStyle=themeColor('--accent'); ctx.fill();
    const tooltip=$('charttooltip');
    tooltip.innerHTML='<strong>'+esc(series[index].t.replace('T',' · '))+' UTC</strong><span><i></i>'+esc($('chartmetric').textContent)+'<b>'+esc(state.metric === 'revenue' ? money(Math.round(values[index] * 100), state.data.currency) : fmt(values[index]))+'</b></span>';
    tooltip.hidden=false;
    tooltip.style.left=Math.max(8,Math.min(canvas.offsetLeft+x(index)+12,canvas.parentElement.clientWidth-220))+'px'; tooltip.style.top='28px';
  };
  canvas.onpointerleave=()=>{ $('charttooltip').hidden=true; renderChart(); };
}

function niceCeil(n) {
  // Small counts use their own exact value as the axis top, so 1 visitor
  // reaches the top of the chart instead of sitting at a quarter of a
  // padded-out axis that goes up to 4 regardless of what actually happened.
  if (n <= 4) return Math.max(1, Math.round(n));
  const mag = Math.pow(10, Math.floor(Math.log10(n)));
  return Math.ceil(n / (mag / 2)) * (mag / 2);
}

function shortDate(t) {
  if (!t) return "";
  if (t.includes("T")) return t.slice(11, 16);
  const d = new Date(t + "T00:00:00Z");
  return d.toLocaleDateString(undefined, { day: "numeric", month: "short", timeZone: "UTC" });
}

// ISO2 → flag emoji, no image assets needed.
function flag(iso) {
  if (!iso || iso.length !== 2 || !/^[A-Za-z]{2}$/.test(iso)) return "";
  return String.fromCodePoint(...[...iso.toUpperCase()].map((c) => 0x1f1e6 + c.charCodeAt(0) - 65));
}

let LANG_NAMES = null;
function languageName(tag) {
  if (!tag) return tag;
  try {
    LANG_NAMES ||= new Intl.DisplayNames(undefined, { type: "language" });
    return LANG_NAMES.of(tag) + " (" + tag + ")";
  } catch { return tag; }
}

function ago(ts) {
  const s = Math.max(0, Math.floor(Date.now() / 1000) - ts);
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  if (s < 7 * 86400) return Math.floor(s / 86400) + "d ago";
  return new Date(ts * 1000).toLocaleDateString(undefined, { day: "numeric", month: "short" });
}

async function renderVisits(host) {
  host.innerHTML = '<div class="empty">Loading visits…</div>';

    site: state.site, from: state.range.from, to: state.range.to,
    filters: JSON.stringify(state.filters), limit: "50",
  });
  const res = await fetch("/api/visits?" + params);
  if (!res.ok) { host.innerHTML = '<div class="empty">Could not load visits.</div>'; return; }
  const { visits } = await res.json();

  if (!visits.length) {
    host.innerHTML = '<div class="empty">No visits in this range.</div>';
    return;
  }

  host.innerHTML = '<div class="visits">' + visits.map((v) => {
    const place = [v.city, v.region, countryName(v.country)].filter(Boolean).join(", ") || "Unknown location";
    const dev = [v.browser, v.os, v.device].filter(Boolean).join(" · ");
    const src = v.ref_domain || v.channel || "Direct";
    const journey = v.entry === v.exit || !v.exit
      ? esc(v.entry || "—")
      : esc(v.entry || "—") + ' <span class="arr">→</span> ' + esc(v.exit);
    const meta = [v.network, v.language, v.screen ? v.screen + "px" : null, v.timezone]
      .filter(Boolean).map(esc).join(" · ");
    return `
      <div class="visit">
        <div class="vtop">
          <span class="vtag ${v.is_returning ? "ret" : "new"}">${v.is_returning ? "RETURNING" : "NEW"}</span>
          <span class="vwhen">${esc(ago(v.started))}</span>
          <span class="vplace">${flag(v.country)} ${esc(place)}</span>
          <span class="vdev">${esc(dev)}</span>
          <span class="vsrc">${esc(src)}</span>
          <span class="vpath">${journey}</span>
          <span class="vnums tabular">${fmt(v.pageviews)} ${v.pageviews === 1 ? "page" : "pages"} · ${duration(v.duration)}</span>
        </div>
        ${meta ? '<div class="vmeta">' + meta + "</div>" : ""}
      </div>`;
  }).join("") + "</div>" +
  '<p class="note">The 50 most recent visits. Nothing here identifies a person — no cookie, no stored IP, no name.</p>';
}

function propsText(props) {
  if (!props || typeof props !== "object") return "";
  const keys = Object.keys(props);
  if (!keys.length) return "";
  return keys.map((k) => k + ": " + props[k]).join(" · ");
}

function renderExplore(host) {

async function loadJourney(start, silent) {
  state.journeyStart = start;
  document.querySelectorAll("#exstart .exrow").forEach((el) =>
    el.classList.toggle("on", el.dataset.s === start));
  if (!silent) {
    $("exs1").innerHTML = '<div class="exempty">Loading…</div>';

  }
  const params = new URLSearchParams({
    site: state.site, from: state.range.from, to: state.range.to,
    filters: JSON.stringify(state.filters), start,
  });
  const res = await fetch("/api/journey?" + params);
  if (!res.ok) return;
  const j = await res.json();
  fillJourneyCol($("exs1"), j.step1);
  fillJourneyCol($("exs2"), j.step2);
}

function fillJourneyCol(host, list) {
  if (!list || !list.length) {
    host.innerHTML = '<div class="exempty">Sessions end here.</div>';
    return;
  }
  const max = Math.max(...list.map((r) => r.v), 1);
  host.innerHTML = list.map((r) =>
    '<div class="exrow"><div class="bar" style="width:' + (r.v / max) * 100 + '%"></div>' +
    '<span class="lbl">' + esc(r.k) + '</span><span class="val tabular">' + fmt(r.v) + "</span></div>").join("");
}

/* ---- world map ---- */

const MAP_W = 1000, MAP_H = 500;
let mapPaths = null;
let mapScale = 1;

function buildPaths() {
  mapPaths = {};
  for (const iso in WORLD) {
    const path = new Path2D();
    for (const ring of WORLD[iso].r) {
      path.moveTo(ring[0], ring[1]);
      for (let i = 2; i < ring.length; i += 2) path.lineTo(ring[i], ring[i + 1]);
      path.closePath();
    }
    mapPaths[iso] = path;
  }
}

function countryName(iso) {
  return (WORLD[iso] && WORLD[iso].n) || iso;
}

function visitorsByCountry() {
  const out = {};
  for (const row of state.data.countries || []) out[row.k] = row.v;
  return out;
}

function drawMap() {
  const canvas = $("mapcanvas");
  if (!canvas) return;
  if (!mapPaths) buildPaths();

  const counts = visitorsByCountry();
  const max = Math.max(1, ...Object.values(counts));

  const ratio = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || canvas.parentElement.clientWidth;
  const h = w * (MAP_H / MAP_W);
  canvas.style.height = h + "px";
  canvas.width = w * ratio;
  canvas.height = h * ratio;

  mapScale = w / MAP_W;
  const ctx = canvas.getContext("2d");
  ctx.setTransform(ratio * mapScale, 0, 0, ratio * mapScale, 0, 0);
  ctx.clearRect(0, 0, MAP_W, MAP_H);

  ctx.lineWidth = 0.8 / mapScale;
  ctx.strokeStyle = themeColor("--card");

  for (const iso in mapPaths) {
    const v = counts[iso] || 0;
    if (v) {
      const t = 0.3 + 0.7 * Math.sqrt(v / max);
      ctx.fillStyle = accA(t.toFixed(3));
    } else {
      ctx.fillStyle = themeColor("--map-empty");
    }
    ctx.fill(mapPaths[iso]);
    ctx.stroke(mapPaths[iso]);
  }
}

function countryAt(canvas, clientX, clientY) {
  if (!mapPaths) return null;
  const rect = canvas.getBoundingClientRect();
  const x = (clientX - rect.left) / mapScale;
  const y = (clientY - rect.top) / mapScale;
  const ctx = canvas.getContext("2d");
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  for (const iso in mapPaths) {
    if (ctx.isPointInPath(mapPaths[iso], x, y)) return iso;
  }
  return null;
}

const tip = document.createElement("div");
tip.className = "maptip";
document.body.appendChild(tip);

document.addEventListener("mousemove", (e) => {
  const canvas = $("mapcanvas");
  if (!canvas || !state.data || e.target !== canvas) { tip.style.display = "none"; return; }
  const iso = countryAt(canvas, e.clientX, e.clientY);
  if (!iso) { tip.style.display = "none"; canvas.style.cursor = "default"; return; }
  const v = visitorsByCountry()[iso] || 0;
  tip.innerHTML = "<b>" + esc(countryName(iso)) + "</b>" + fmt(v) + (v === 1 ? " visitor" : " visitors");
  tip.style.display = "block";
  tip.style.left = e.clientX + 14 + "px";
  tip.style.top = e.clientY + 14 + "px";
  canvas.style.cursor = "pointer";
});

document.addEventListener("click", (e) => {
  const canvas = $("mapcanvas");
  if (!canvas || e.target !== canvas) return;
  const iso = countryAt(canvas, e.clientX, e.clientY);
  if (!iso || !(visitorsByCountry()[iso] > 0)) return;
  if (!state.filters.some((f) => f.field === "country" && [].concat(f.value).includes(iso))) {
    state.filters.push({ field: "country", op: "is", value: [iso] });
    resetAndLoad();
  }
});

/* ---- shortcuts: "/" focuses site search on the index ---- */
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && !state.site && !/INPUT|TEXTAREA/.test(e.target.tagName)) {
    e.preventDefault();
    const s = $("sitesearch");
    if (s) s.focus();
  }
});

window.addEventListener("resize", () => {
  if (state.site && state.data) { renderChart(); drawMap(); }
});

route();
</script>
</body>
</html>
